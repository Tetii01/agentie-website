# Preview pentru branch-ul „design".
#
# Pe planul Hobby, într-un repo privat, Vercel blochează deploy-urile automate din Git
# pentru commit-urile altor persoane decât proprietarul contului. Workflow-ul ăsta face
# deploy-ul de preview cu tokenul proprietarului și îl publică la o adresă fixă.
# Deploy-urile automate ale integrării Git sunt oprite pentru „design" în vercel.json.
#
# Secrete necesare în repo: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

name: Preview design

on:
  push:
    branches: [design]

# Un singur deploy odată; un push nou îl anulează pe cel în curs.
concurrency:
  group: preview-design
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  DESIGN_ALIAS: agentie-website-design.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalează Vercel CLI
        run: npm install --global vercel@latest

      - name: Setările proiectului (mediul Preview)
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy de preview (fără --prod)
        id: deploy
        run: |
          vercel deploy --prebuilt --token="$VERCEL_TOKEN" > deploy-output.txt
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' deploy-output.txt | head -1)
          if [ -z "$url" ]; then
            echo "Nu am găsit adresa deploy-ului în răspunsul Vercel:"
            cat deploy-output.txt
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Adresa fixă → deploy-ul nou
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: vercel alias set "$DEPLOY_URL" "$DESIGN_ALIAS" --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"

      - name: Rezumat
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Preview design"
            echo "- Adresa fixă: https://$DESIGN_ALIAS"
            echo "- Deploy-ul acesta: $DEPLOY_URL"
          } >> "$GITHUB_STEP_SUMMARY"
